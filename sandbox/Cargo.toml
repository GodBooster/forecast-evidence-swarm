[package]
name = "forecast-near-sandbox"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
near-workspaces = "=0.24.0"
serde = { version = "1", features = ["derive"] }
